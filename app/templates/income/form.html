{% extends "base.html" %}

{% block title %}{% if income %}Edit Income{% else %}Add Income{% endif %} - Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-{% if income %}pencil-square{% else %}plus-circle-fill text-success{% endif %} me-2"></i>
                        {% if income %}Edit Income Record{% else %}Record New Income{% endif %}
                    </h5>
                    <a href="{{ url_for('income.index') }}" class="btn btn-sm btn-outline-secondary rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="amount" class="form-label fw-semibold text-secondary small">Amount (in ₹ INR) *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-success fw-bold">₹</span>
                                <input type="number" step="0.01" min="0.01" class="form-control form-control-lg" id="amount" name="amount" value="{{ income.amount if income else '' }}" placeholder="0.00" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="source" class="form-label fw-semibold text-secondary small">Income Source / Category *</label>
                            <select class="form-select" id="source" name="source" required>
                                <option value="" disabled {% if not income %}selected{% endif %}>Select income source</option>
                                {% for s in sources %}
                                <option value="{{ s }}" {% if income and income.source == s %}selected{% endif %}>{{ s }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="date" class="form-label fw-semibold text-secondary small">Date Received *</label>
                            <input type="date" class="form-control" id="date" name="date" value="{{ income.date.strftime('%Y-%m-%d') if income else (today.strftime('%Y-%m-%d') if today else '') }}" required>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold text-secondary small">Description / Notes (Optional)</label>
                            <input type="text" class="form-control" id="description" name="description" value="{{ income.description if income else '' }}" placeholder="e.g. October monthly salary, freelance payment from client X">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1 py-2 fw-semibold rounded-3">
                                <i class="bi bi-check-lg me-1"></i> {% if income %}Save Changes{% else %}Save Income Record{% endif %}
                            </button>
                            <a href="{{ url_for('income.index') }}" class="btn btn-light py-2 rounded-3">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
