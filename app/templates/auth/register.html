{% extends "base.html" %}

{% block title %}Register - Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-dark-slate text-white text-center py-4 border-0">
                    <div class="brand-icon-wrap mx-auto mb-2">
                        <i class="bi bi-person-plus text-emerald"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Create Account</h4>
                    <p class="text-muted-custom small mb-0">Start managing your personal finances with AI</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold small text-secondary">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control bg-light border-start-0 ps-0" id="name" name="name" value="{{ name or '' }}" placeholder="Your Name" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small text-secondary">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-light border-start-0 ps-0" id="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-light border-start-0 ps-0" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold small text-secondary">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                                <input type="password" class="form-control bg-light border-start-0 ps-0" id="confirm_password" name="confirm_password" placeholder="Confirm your password" minlength="6" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3 shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center">
                        <span class="small text-muted">Already have an account? </span>
                        <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-primary text-decoration-none">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
